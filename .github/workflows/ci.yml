name: API checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/store
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/store
        run: npx prisma validate
      - run: node --check src/server.js
      - run: node --check src/routes/orders.js
      - run: node --check src/routes/payments.js
      - run: node --check src/services/payments.js
